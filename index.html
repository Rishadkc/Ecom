<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison Edit — Build Your Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efede9;--panel:#f7f6f3;--tile:#ebe9e5;
  --ink:#151515;--ink-2:#5e5c58;--mute:#9b9892;--line:#e4e1dc;
  --serif:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --fh:85.5vh;
  --sheet:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261113_132845_faa91ba1-ab25-49d9-8de1-44b84b0d65f7.png&w=1000&q=88");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:clamp(11px,.86vw,13px);line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.ic{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#app{height:100vh;display:grid;grid-template-columns:minmax(0,357fr) minmax(0,500fr) minmax(0,292fr);padding:0 7.3vw}
.panel{background:var(--panel);border-radius:14px;box-shadow:0 1px 1px rgba(0,0,0,.02),0 10px 30px -18px rgba(40,30,20,.18)}

/* thumbnails: product sheet cropped with CSS */
.pt{background-image:var(--sheet);background-repeat:no-repeat;background-color:var(--tile);background-size:333.46% 584%;aspect-ratio:523/400}
.pt.lk{background-size:333.46% 519%;aspect-ratio:523/450}
.pt.st{background-size:333.46% 435.01%;aspect-ratio:523/537}

/* ---------- left ---------- */
#left{padding:2.6vh 0 3.4vh;display:flex;flex-direction:column;min-height:0}
.top{height:6vh;display:flex;align-items:center;justify-content:space-between;flex:none}
.logo{font-family:var(--serif);font-weight:500;font-size:clamp(20px,2.15vw,32px);letter-spacing:.035em;white-space:nowrap}
.burger svg{width:22px;height:22px}
.shop{margin-top:1.6vh;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.search{margin:2vh 1.1vw 0;height:clamp(34px,4.6vh,44px);border-radius:22px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px -10px rgba(40,30,20,.2);display:flex;align-items:center;gap:.7em;padding:0 1.2em;flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.tabs{position:relative;display:flex;gap:clamp(12px,1.75vw,26px);margin:1.8vh 1.1vw 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:0 0 1.1vh;color:var(--ink-2);white-space:nowrap;transition:color .25s}
.tabs button.on{color:var(--ink);font-weight:500}
.tabs .bar{position:absolute;bottom:0;height:2px;background:var(--ink);left:0;width:0;transition:left .4s cubic-bezier(.6,0,.2,1),width .4s cubic-bezier(.6,0,.2,1)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 1.1vw 2vh;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin:2.2vh 0 1.4vh}
.hd h3{font-size:1.08em;font-weight:600}
.hd a,.hd span{color:var(--ink-2);font-size:.92em;cursor:default}
.hd a{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:.6vw}
.store{height:clamp(40px,7.6vh,58px);border-radius:8px;background:var(--tile);border:1.5px solid transparent;display:grid;place-items:center;text-align:center;line-height:1.1;transition:transform .25s,background .25s,border-color .25s;overflow:hidden;padding:0 2px}
.store:hover{transform:translateY(-2px)}
.store.on{background:#fff;border-color:var(--ink)}
.w-norra{font-weight:600;letter-spacing:.2em;font-size:.86em;margin-right:-.2em}
.w-lune{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.25em}
.w-meridian{font-family:var(--serif);font-weight:600;font-size:.86em;letter-spacing:.06em}
.w-ode{font-weight:600;font-size:.8em;letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vh 1.1vw}
.card{cursor:pointer;animation:fadeUp .38s both cubic-bezier(.2,.7,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.card .ph{position:relative;border-radius:8px;overflow:hidden;border:1.5px solid transparent;transition:border-color .25s}
.card .pt{width:100%}
.card:hover .ph{border-color:#d3cfc8}
.card.worn .ph{border-color:var(--ink)}
.heart{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;transition:transform .45s var(--spring)}
.heart svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:1.6;transition:fill .2s}
.heart.on{transform:scale(1.12)}
.heart.on svg{fill:var(--ink)}
.heart:active{transform:scale(.85)}
.tag{position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:.68em;font-weight:600;letter-spacing:.12em;padding:.35em .7em;border-radius:20px;transform:translateY(160%);opacity:0;transition:transform .5s var(--spring),opacity .25s}
.card.worn .tag{transform:none;opacity:1}
.chip{position:absolute;right:6px;bottom:6px;background:#fff;font-size:.8em;font-weight:500;padding:.35em .8em;border-radius:20px;opacity:0;transition:opacity .25s;box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.card:hover .chip{opacity:1}
.card.worn .chip{display:none}
.card .st0,.row .st0,.rc .st0{font-size:.72em;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.card .st0{margin-top:.9vh}
.card .nm{color:var(--ink-2)}
.card .pr,.row .pr,.rc .pr{font-weight:500}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:1.1vh 0 1.3vh}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.8em;color:var(--mute);transition:color .25s}
.tabbar button.on,.tabbar button:hover{color:var(--ink)}
.tabbar button.on{font-weight:500}

/* ---------- stage ---------- */
#stage{position:relative;min-width:0}
#figure{position:absolute;left:45%;top:3.6vh;height:var(--fh);aspect-ratio:1360/2048;transform:translateX(-50%);--ry:0deg;--sx:0px}
#body{position:absolute;inset:0;perspective:1600px;cursor:grab;touch-action:pan-y;z-index:3}
#body.drag{cursor:grabbing}
#spin{position:absolute;inset:0;transform:rotateY(var(--ry));transform-origin:50% 100%}
#spin canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cNew{visibility:hidden}
#glint{position:absolute;left:6%;right:6%;height:2px;background:#fff;box-shadow:0 0 12px 3px rgba(255,255,255,.9),0 0 30px 8px rgba(255,255,255,.5);opacity:0;pointer-events:none;transform:translateY(-1px)}
#tt{position:absolute;width:112%;left:-6%;height:calc(var(--fh)*1360/2048*1.12/3.3);top:calc(98.6% - .40*var(--fh)*1360/2048*1.12/3.3);z-index:1}
#tt .side{position:absolute;inset:16% 0 0 0;border-radius:50%;background:linear-gradient(#e2dfda,#d3cfc8)}
#tt .face{position:absolute;inset:0 0 16% 0;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#fdfcfb,#f3f1ee 60%,#e7e4df)}
#tt .ring{position:absolute;inset:0 0 16% 0;width:100%;height:84%;overflow:visible}
#tt .ring ellipse{fill:none;stroke:rgba(0,0,0,.13);stroke-width:1;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
#tt .lbl{position:absolute;left:0;right:0;top:56%;display:flex;justify-content:center;align-items:center;gap:.5em;font-size:.82em;color:var(--mute);letter-spacing:.08em;white-space:nowrap}
#tt .lbl svg{width:3.4em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
#tt:hover .lbl svg:first-child{transform:translateX(-4px)}
#tt:hover .lbl svg:last-child{transform:translateX(4px)}
#shadow{position:absolute;top:96.6%;left:50%;width:46%;height:4.2%;transform:translate(calc(-50% + var(--sx)),-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.26),transparent 70%);filter:blur(2px);z-index:2;pointer-events:none}

#rail{position:absolute;left:8.4%;top:8.6vh;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);z-index:6}
.rb{position:relative;width:clamp(30px,5.2vh,40px);height:clamp(30px,5.2vh,40px);border-radius:50%;background:#fbfaf8;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 14px -8px rgba(40,30,20,.3);display:grid;place-items:center;transition:transform .25s,background .25s,color .25s,opacity .25s}
.rb:hover{transform:scale(1.08)}
.rb.on{background:var(--ink);color:#fff}
.rb:disabled{opacity:.4;cursor:default;transform:none}
.rb svg{width:46%;height:46%}
.rb .tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);background:var(--ink);color:#fff;font-size:11px;padding:.45em .9em;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.rb:hover .tip{opacity:1;transform:translate(0,-50%)}

#strip{position:absolute;left:75.4%;top:10.8vh;background:#fbfaf8;border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 24px -14px rgba(40,30,20,.3);z-index:6}
#strip .pt{width:clamp(36px,4vw,56px);border-radius:6px;cursor:pointer;outline:1.5px solid transparent;outline-offset:-1.5px;transition:outline-color .2s}
#strip .pt:hover,#strip .pt.hl{outline-color:var(--ink)}
#strip .pt.pop{animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(.6);opacity:.4}}

#mode{position:absolute;left:72%;top:4vh;background:#fbfaf8;border-radius:20px;padding:3px;display:flex;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 18px -12px rgba(40,30,20,.3);z-index:6}
#mode button{position:relative;z-index:1;width:3.2em;height:2.1em;font-size:.86em;font-weight:500;color:var(--ink-2);transition:color .3s}
#mode button.on{color:#fff}
#mode i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--ink);border-radius:20px;transition:transform .4s cubic-bezier(.6,0,.2,1)}
#stage.ar #mode i{transform:translateX(100%)}

#ar{position:absolute;left:4%;right:4%;top:2.6vh;bottom:3.4vh;border-radius:16px;overflow:hidden;opacity:0;transform:scale(.96);transition:opacity .6s,transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:0;background:#d9d4cc}
#stage.ar #ar{opacity:1;transform:none}
#ar img{width:100%;height:100%;object-fit:cover}
#ar b{position:absolute;width:22px;height:22px;border:2px solid #fff;opacity:.95}
#ar b:nth-of-type(1){left:14px;top:14px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
#ar b:nth-of-type(2){right:14px;top:14px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
#ar b:nth-of-type(3){left:14px;bottom:14px;border-right:0;border-top:0;border-radius:0 0 0 6px}
#ar b:nth-of-type(4){right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 6px 0}
#ar .scan{position:absolute;left:0;right:0;top:0;height:2px;background:#fff;box-shadow:0 0 16px 4px rgba(255,255,255,.8);opacity:0}
#stage.ar #ar .scan{animation:scan 1.4s .25s ease-in-out 1}
@keyframes scan{0%{top:0;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
#ar .arl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(21,21,21,.55);color:#fff;font-size:11px;padding:.5em 1em;border-radius:20px;display:flex;align-items:center;gap:.6em;white-space:nowrap;backdrop-filter:blur(6px)}
#ar .arl i{width:7px;height:7px;border-radius:50%;background:#e5342b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* ---------- right ---------- */
#right{padding:8.6vh 0 3.4vh;display:flex;flex-direction:column;gap:1.4vh;min-height:0}
.look{flex:1;min-height:0;display:flex;flex-direction:column;padding:2vh 1.1vw 1.8vh}
.lh{display:flex;justify-content:space-between;align-items:baseline;flex:none}
.lh h2{font-size:.86em;font-weight:600;letter-spacing:.2em}
.lh #total{font-weight:600;font-size:1.1em;font-variant-numeric:tabular-nums}
#rows{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:1vh}
.row{flex:1;min-height:0;display:flex;align-items:center;gap:.9vw;border-bottom:1px solid var(--line);cursor:pointer;padding:.5vh 0}
.row .pt{height:min(9vh,100%);border-radius:8px;flex:none;outline:1.5px solid transparent;outline-offset:-1.5px;transition:outline-color .2s}
.row.hl .pt{outline-color:var(--ink)}
.row .pt.swap{animation:swapIn .55s var(--spring)}
@keyframes swapIn{from{transform:scale(.6) rotate(-8deg);opacity:.3}}
.row .tx{flex:1;min-width:0}
.row .nm,.rc .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--mute);font-size:1.5em;line-height:1;transition:transform .25s,color .25s}
.row:hover .chev{transform:translateX(2px);color:var(--ink)}
.sf{flex:none;margin-top:1.5vh}
.sf h4{font-size:.74em;font-weight:600;letter-spacing:.2em;margin-bottom:.8vh}
.fit{position:relative;display:flex;align-items:center;gap:.6em;padding:.45vh 0}
.fit .ck{width:1.25em;height:1.25em;border-radius:50%;border:1.3px solid var(--mute);display:grid;place-items:center;flex:none;transition:background .35s,border-color .35s}
.fit .ck svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .45s}
.fit.ok .ck{background:var(--ink);border-color:var(--ink)}
.fit.ok .ck svg{stroke-dashoffset:0}
.fit:nth-child(3) .ck,.fit:nth-child(3) .ck svg{transition-delay:.14s}
.fit:nth-child(4) .ck,.fit:nth-child(4) .ck svg{transition-delay:.28s}
.fit .inf{color:var(--mute);width:1.05em;height:1.05em;flex:none}
.fit .pc{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.fit .bub{position:absolute;right:0;bottom:calc(100% + 2px);background:var(--ink);color:#fff;font-size:11px;padding:.5em .9em;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
.fit:hover .bub{opacity:1;transform:none}
#buy{position:relative;flex:none;margin-top:1.5vh;height:clamp(36px,5.2vh,44px);border-radius:9px;background:#2b2b2b;color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;gap:.6em;overflow:hidden;transition:transform .15s}
#buy:active{transform:scale(.985)}
#buy svg{width:1.1em;height:1.1em}
#buy::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg)}
#buy.sweep::after{animation:sweep .8s ease-out}
@keyframes sweep{to{left:120%}}
#buy .badge{position:absolute;right:10px;top:50%;width:1.7em;height:1.7em;margin-top:-.85em;border-radius:50%;background:#fff;color:var(--ink);font-size:.82em;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--spring)}
#buy .badge.on{transform:scale(1)}
.rec{flex:none;padding:1.6vh 1.1vw 1.8vh}
.rec h3{display:flex;align-items:center;gap:.5em;font-size:1em;font-weight:600;margin-bottom:1.1vh}
.rec h3 svg{width:1.05em;height:1.05em;fill:currentColor}
#recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7vw}
.rc{cursor:pointer;min-width:0;animation:fadeUp .38s both}
.rc .pt{width:100%;border-radius:8px;outline:1.5px solid transparent;outline-offset:-1.5px;transition:outline-color .2s}
.rc:hover .pt{outline-color:#d3cfc8}
.rc .st0{margin-top:.7vh;font-size:.66em}
.rc .nm{font-size:.9em}

#toast{position:fixed;top:14px;left:50%;background:var(--ink);color:#fff;font-size:12px;padding:.65em 1.3em;border-radius:30px;white-space:nowrap;transform:translate(-50%,-180%);opacity:0;transition:transform .5s var(--spring),opacity .25s;z-index:50;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
.fly{position:fixed;z-index:40;border-radius:8px;pointer-events:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);transition:left .6s cubic-bezier(.5,0,.2,1),top .6s cubic-bezier(.5,0,.2,1),width .6s cubic-bezier(.5,0,.2,1),height .6s cubic-bezier(.5,0,.2,1),opacity .6s}

@media (max-width:1100px){#app{padding:0 3vw}}
@media (max-width:860px){
  :root{--fh:calc(min(92svh,820px)*.855)}
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column;padding:16px;gap:16px}
  #stage{order:1;height:min(92svh,820px);flex:none}
  #right{order:2;padding:0;gap:16px}
  #left{order:3;padding:0;height:88svh;flex:none}
  #figure{left:50%;top:3.6%}
  #rail{left:0;top:16px}
  #strip{left:auto;right:0;top:64px}
  #mode{left:auto;right:0;top:12px}
  #ar{left:0;right:0;top:0;bottom:0}
  .top{height:48px}
  .shop{margin-top:10px}
  .search{margin:14px 14px 0}
  .tabs{margin:14px 14px 0}
  .scroll{padding:0 14px 16px}
  .grid{gap:16px 12px}
  .stores{gap:8px}
  .look{padding:16px 14px}
  .row{flex:none;height:76px;gap:12px}
  .row .pt{height:62px}
  .rec{padding:14px}
  #recs{gap:10px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="top">
      <div class="logo">MAISON EDIT</div>
      <button class="burger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
    </div>
    <section class="panel shop">
      <label class="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="Search for products, brands or styles..." autocomplete="off">
      </label>
      <nav class="tabs" id="tabs">
        <button data-c="all" class="on">All</button>
        <button data-c="t">Tops</button>
        <button data-c="k">Bottoms</button>
        <button data-c="s">Shoes</button>
        <button data-c="g">Bags</button>
        <button data-c="a">Accessories</button>
        <i class="bar"></i>
      </nav>
      <div class="scroll">
        <div class="hd"><h3>Shop by Store</h3><a id="seeAll">See all</a></div>
        <div class="stores" id="stores">
          <button class="store" data-s="norra"><span class="w-norra">NORRA</span></button>
          <button class="store" data-s="lune"><span class="w-lune">Lune&amp;Co</span></button>
          <button class="store" data-s="meridian"><span class="w-meridian">MERIDIAN</span></button>
          <button class="store" data-s="ode"><span class="w-ode">ODE<br>STUDIO</span></button>
        </div>
        <div class="hd"><h3 id="gridTitle">Popular in your style</h3><span id="count"></span></div>
        <div class="grid" id="grid"></div>
      </div>
      <nav class="tabbar" id="tabbar">
        <button data-t="home"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Home</button>

  g1:{store:'ode',name:'Buckle shoulder bag',price:189.00,c:0,r:3,tags:['minimal','sharp']},
  g2:{store:'lune',name:'Quilted mini bag',price:159.00,c:1,r:3,tags:['romantic','soft']},
  g3:{store:'meridian',name:'Wine top-handle bag',price:175.00,c:2,r:3,tags:['romantic','wine']}
};
const KEYS=Object.keys(P);
const TX=[44,610,1177],TY=[42,611,1180,1749];
const pos=(key,ch)=>{const p=P[key];
  return 'background-position:'+(TX[p.c]/(1744-523)*100).toFixed(3)+'% '+((TY[p.r]+(537-ch)/2)/(2336-ch)*100).toFixed(3)+'%'};
const money=n=>'$'+n.toFixed(2);
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;');

/* ---------- state ---------- */
let look={t:'t1',k:'k1',s:'s1',g:'g1'};
const hist=[];
const saved=new Set(['k2']);
const filter={cat:'all',store:null,saved:false,q:''};

/* ---------- toast ---------- */
const toastEl=$('#toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),1800)}

/* ---------- compositor ---------- */
const W=1000,HH=1506;
const cOld=$('#cOld'),cNew=$('#cNew'),glint=$('#glint');
const ctxOld=cOld.getContext('2d'),ctxNew=cNew.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=HH;const octx=off.getContext('2d');
const IMG={},MSK={};let ready=false;
function load(src,cors){return new Promise((res,rej)=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function draw(ctx,lk){
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,W,HH);
  ctx.drawImage(IMG.base,0,0,W,HH);
  for(const cat of ['s','k','t','g']){
    const key=lk[cat];
    if(key.endsWith('1'))continue;
    octx.globalCompositeOperation='source-over';
    octx.clearRect(0,0,W,HH);
    octx.drawImage(MSK[key],0,0,W,HH);
    octx.globalCompositeOperation='source-in';
    octx.drawImage(IMG[key],0,0,W,HH);
    ctx.globalCompositeOperation='destination-out';
    ctx.drawImage(MSK[key],0,0,W,HH);
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(off,0,0);
  }
  ctx.globalCompositeOperation='source-over';
}
const REGION={t:[.07,.53],k:[.32,.57],s:[.53,1],g:[.45,.75]};
let anim=null;
function resetClips(){cOld.style.clipPath='';cNew.style.clipPath='';cNew.style.visibility='hidden';glint.style.opacity=0}
function render(cats){
  if(!ready)return;
  if(anim){cancelAnimationFrame(anim.raf);draw(ctxOld,anim.to);resetClips();anim=null}
  if(!cats||!cats.length){draw(ctxOld,look);return}
  const to=Object.assign({},look);
  draw(ctxNew,to);
  const y0=Math.min.apply(null,cats.map(c=>REGION[c][0]))*100,y1=Math.max.apply(null,cats.map(c=>REGION[c][1]))*100;
  const t0=performance.now();
  anim={to:to,raf:0};
  cNew.style.visibility='visible';
  const step=now=>{
    let p=Math.min(1,(now-t0)/720);
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const y=y0+(y1-y0)*e;
    cNew.style.clipPath='inset(0 0 '+(100-y)+'% 0)';
    cOld.style.clipPath='inset('+y+'% 0 0 0)';
    glint.style.top=y+'%';
    glint.style.opacity=Math.sin(Math.PI*p).toFixed(3);
    if(p<1){anim.raf=requestAnimationFrame(step)}
    else{draw(ctxOld,to);resetClips();anim=null}
  };
  anim.raf=requestAnimationFrame(step);
}

/* ---------- number count-up ---------- */
function countTo(el,to,fmt){
  const from=el._v==null?to:el._v;el._v=to;
  cancelAnimationFrame(el._r);
  if(from===to){el.textContent=fmt(to);return}
  const t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/600),e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e);
    if(p<1)el._r=requestAnimationFrame(f)};
  el._r=requestAnimationFrame(f);
}

/* ---------- fly ---------- */
function fly(key,fromEl,toEl,done){
  if(!fromEl||!toEl||!fromEl.isConnected){done&&done();return}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  if(!a.width||!b.width){done&&done();return}
  const f=document.createElement('div');
  f.className='pt st fly';
  f.style.cssText=pos(key,537)+';aspect-ratio:auto;left:'+a.left+'px;top:'+a.top+'px;width:'+a.width+'px;height:'+a.height+'px';
  document.body.appendChild(f);
  f.getBoundingClientRect();
  f.style.left=b.left+'px';f.style.top=b.top+'px';f.style.width=b.width+'px';f.style.height=b.height+'px';f.style.opacity=.35;
  setTimeout(()=>{f.remove();done&&done()},620);
}

/* ---------- shop grid ---------- */
const grid=$('#grid'),gridTitle=$('#gridTitle'),countEl=$('#count');
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg>';
function renderGrid(){
  const q=filter.q.trim().toLowerCase();
  const list=KEYS.filter(k=>{const p=P[k];
    if(filter.cat!=='all'&&k[0]!==filter.cat)return false;
    if(filter.store&&p.store!==filter.store)return false;
    if(filter.saved&&!saved.has(k))return false;
    if(q){const hay=(p.name+' '+STORES[p.store]+' '+STORE_NAME[p.store]+' '+CAT_NAME[k[0]]+' '+p.tags.join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true});
  gridTitle.textContent=filter.saved?'Saved pieces':filter.store?STORE_NAME[filter.store]+' picks':'Popular in your style';
  countEl.textContent=list.length+(list.length===1?' item':' items');
  grid.innerHTML=list.map((k,i)=>{const p=P[k];
    return '<div class="card'+(look[k[0]]===k?' worn':'')+'" data-k="'+k+'" style="animation-delay:'+(i*35)+'ms">'+
      '<div class="ph"><div class="pt" style="'+pos(k,400)+'"></div>'+
      '<button class="heart'+(saved.has(k)?' on':'')+'" aria-label="Save">'+HEART+'</button>'+
      '<span class="tag">WEARING</span><span class="chip">Try on</span></div>'+
      '<div class="st0">'+esc(STORES[p.store])+'</div><div class="nm">'+p.name+'</div><div class="pr">'+money(p.price)+'</div></div>'}).join('');
}
grid.addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const k=card.dataset.k,h=e.target.closest('.heart');
  if(h){
    if(saved.has(k))saved.delete(k);else saved.add(k);
    h.classList.toggle('on',saved.has(k));
    if(filter.saved)renderGrid();
    return;
  }
  wear(k,card.querySelector('.pt'));
});

/* tabs */
const tabs=$('#tabs'),bar=tabs.querySelector('.bar');
function moveBar(){const b=tabs.querySelector('button.on');if(!b)return;bar.style.left=b.offsetLeft+'px';bar.style.width=b.offsetWidth+'px'}
function setCat(c){
  filter.cat=c;
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  moveBar();
  rail.querySelectorAll('.rb[data-cat]').forEach(b=>b.classList.toggle('on',b.dataset.cat===c));
  renderGrid();
}
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setCat(b.dataset.c)});
addEventListener('resize',moveBar);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveBar);

/* search */
$('#q').addEventListener('input',e=>{filter.q=e.target.value;renderGrid()});

/* stores */
const storesEl=$('#stores');
function setStore(s){filter.store=s;storesEl.querySelectorAll('.store').forEach(b=>b.classList.toggle('on',b.dataset.s===s));renderGrid()}
storesEl.addEventListener('click',e=>{const b=e.target.closest('.store');if(b)setStore(filter.store===b.dataset.s?null:b.dataset.s)});
$('#seeAll').addEventListener('click',()=>setStore(null));

/* tab bar */
const tabbar=$('#tabbar');
function setTab(t){tabbar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
tabbar.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;
  if(t==='home'){filter.saved=false;filter.q='';$('#q').value='';filter.store=null;storesEl.querySelectorAll('.store').forEach(x=>x.classList.remove('on'));setTab('explore');setCat('all')}
  else if(t==='explore'){filter.saved=false;setTab('explore');renderGrid()}
  else if(t==='saved'){filter.saved=true;setTab('saved');renderGrid()}
  else if(t==='outfits'){stylist()}
});

/* ---------- rail ---------- */
const rail=$('#rail');
const S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
const RAIL=[
  {id:'undo',tip:'Undo',svg:S+'<path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2" transform="translate(0 -2.500)"/></svg>'},
  {id:'size',tip:'Body & size',svg:S+'<circle cx="12" cy="4.500" r="2.200"/><path d="M7 9.500h10M12 9.500V15M12 15l-3 6.500M12 15l3 6.500"/></svg>'},
  {cat:'t',svg:S+'<path d="M8.500 4 3 7l2 4 2.500-1.200V20h9V9.800L19 11l2-4-5.500-3a3.500 3.500 0 0 1-7 0z"/></svg>'},
  {cat:'k',svg:S+'<path d="M7 5h10l3.500 14h-17zM7 5v2.500h10V5M10 8l-1 11M14 8l1 11"/></svg>'},
  {cat:'s',svg:S+'<path d="M8 3h6v8.500l5.500 4a2 2 0 0 1 .8 1.600V20H8zM8 16h6"/></svg>'},
  {cat:'g',svg:S+'<path d="M5 9h14l1.500 11h-17zM9 9V7a3 3 0 0 1 6 0v2"/></svg>'},
  {id:'ai',tip:'AI stylist · surprise me',svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.200 7.800L22 12l-7.800 2.200L12 22l-2.200-7.800L2 12l7.800-2.200z"/></svg>'}
];
rail.innerHTML=RAIL.map(b=>'<button class="rb" '+(b.cat?'data-cat="'+b.cat+'"':'data-id="'+b.id+'"')+'>'+b.svg+'<span class="tip">'+(b.tip||'').replace('&','&amp;')+'</span></button>').join('');
const undoBtn=rail.querySelector('[data-id=undo]');
rail.addEventListener('click',e=>{
  const b=e.target.closest('.rb');if(!b||b.disabled)return;
  if(b.dataset.cat){const c=b.dataset.cat;cycle(c);setCat(c)}
  else if(b.dataset.id==='undo')undo();
  else if(b.dataset.id==='size')toast('Size M · 165 cm · fit profile saved');
  else if(b.dataset.id==='ai')stylist();
});

/* ---------- strip ---------- */
const strip=$('#strip');
strip.innerHTML=CATS.map(c=>'<div class="pt st" data-cat="'+c+'"></div>').join('');
const slot=c=>strip.querySelector('[data-cat='+c+']');
strip.addEventListener('click',e=>{const t=e.target.closest('.pt');if(t)cycle(t.dataset.cat)});
strip.addEventListener('mouseover',e=>{const t=e.target.closest('.pt');rowsEl.querySelectorAll('.row').forEach(r=>r.classList.toggle('hl',!!t&&r.dataset.cat===t.dataset.cat))});
strip.addEventListener('mouseleave',()=>rowsEl.querySelectorAll('.row').forEach(r=>r.classList.remove('hl')));

/* ---------- 3D / AR ---------- */
const stage=$('#stage'),modeEl=$('#mode');
modeEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const ar=b.dataset.m==='ar';stage.classList.toggle('ar',ar);
  modeEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});

/* ---------- drag to rotate + turntable ring ---------- */
const figure=$('#figure'),bodyEl=$('#body'),ring=$('#ring');
let ry=0,dragging=false,startX=0,startRy=0,vel=0,ringOff=0,lastRy=0;
bodyEl.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startRy=ry;bodyEl.classList.add('drag');try{bodyEl.setPointerCapture(e.pointerId)}catch(_){}});
bodyEl.addEventListener('pointermove',e=>{if(!dragging)return;ry=Math.max(-34,Math.min(34,startRy+(e.clientX-startX)*.22))});
const endDrag=()=>{dragging=false;bodyEl.classList.remove('drag')};
bodyEl.addEventListener('pointerup',endDrag);bodyEl.addEventListener('pointercancel',endDrag);
(function tick(){
  if(!dragging&&ry!==0){ry*=.92;if(Math.abs(ry)<.02)ry=0}
  vel=ry-lastRy;lastRy=ry;
  figure.style.setProperty('--ry',ry.toFixed(2)+'deg');
  figure.style.setProperty('--sx',(-ry*.35).toFixed(2)+'px');
  ringOff-=.12+vel*2.2;
  ring.style.strokeDashoffset=ringOff.toFixed(2);
  requestAnimationFrame(tick);
})();

/* ---------- look panel ---------- */
const rowsEl=$('#rows'),totalEl=$('#total');
rowsEl.innerHTML=CATS.map(c=>'<div class="row" data-cat="'+c+'"><div class="pt lk"></div><div class="tx"><div class="st0"></div><div class="nm"></div><div class="pr"></div></div><span class="chev">›</span></div>').join('');
rowsEl.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;cycle(r.dataset.cat);setCat(r.dataset.cat)});
rowsEl.addEventListener('mouseover',e=>{const r=e.target.closest('.row');strip.querySelectorAll('.pt').forEach(t=>t.classList.toggle('hl',!!r&&t.dataset.cat===r.dataset.cat))});
rowsEl.addEventListener('mouseleave',()=>strip.querySelectorAll('.pt').forEach(t=>t.classList.remove('hl')));

const FITS=[
  {label:'Fits your size',note:'Size M fits your saved measurements'},
  {label:'Matches your style',note:'Based on 4 pieces and your saved styles'},
  {label:'Complements your body shape',note:'Mini length + knee height balance your frame'}
];
const sf=$('#sf');
sf.insertAdjacentHTML('beforeend',FITS.map(f=>'<div class="fit"><span class="ck"><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg></span><span>'+f.label+'</span><svg class="ic inf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.1"/></svg><span class="pc"></span><span class="bub">'+f.note+'</span></div>').join(''));
const fitEls=[].slice.call(sf.querySelectorAll('.fit'));
function scores(){
  const n={};CATS.forEach(c=>P[look[c]].tags.forEach(t=>n[t]=(n[t]||0)+1));
  const top=Math.max.apply(null,Object.keys(n).map(k=>n[k]));
  return [100,Math.min(99,56+9*top),78+(look.k==='k1'?14:look.k==='k3'?10:6)+(look.s!=='s2'?4:0)];
}
const recsEl=$('#recs');
function renderRecs(){
  const mood=P[look.t].tags[0];
  const cand=KEYS.filter(k=>look[k[0]]!==k);
  const pick=cand.filter(k=>P[k].tags.indexOf(mood)>=0).concat(cand.filter(k=>P[k].tags.indexOf(mood)<0)).slice(0,3);
  if(recsEl.dataset.sig===pick.join())return;
  recsEl.dataset.sig=pick.join();
  recsEl.innerHTML=pick.map((k,i)=>{const p=P[k];return '<div class="rc" data-k="'+k+'" style="animation-delay:'+(i*35)+'ms"><div class="pt lk" style="'+pos(k,450)+'"></div><div class="st0">'+esc(STORES[p.store])+'</div><div class="nm">'+p.name+'</div><div class="pr">'+money(p.price)+'</div></div>'}).join('');
}
recsEl.addEventListener('click',e=>{const c=e.target.closest('.rc');if(c)wear(c.dataset.k,c.querySelector('.pt'))});

const total=()=>CATS.reduce((s,c)=>s+P[look[c]].price,0);
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function sync(changed,deferStrip){
  changed=changed||[];
  countTo(totalEl,total(),money);
  CATS.forEach(c=>{
    const k=look[c],p=P[k],row=rowsEl.querySelector('[data-cat='+c+']'),th=row.querySelector('.pt');
    th.style.cssText=pos(k,450);
    row.querySelector('.st0').textContent=STORES[p.store];
    row.querySelector('.nm').textContent=p.name;
    row.querySelector('.pr').textContent=money(p.price);
    if(changed.indexOf(c)>=0)replay(th,'swap');
    const upd=()=>{const s=slot(c);s.style.cssText=pos(look[c],537);if(changed.indexOf(c)>=0)replay(s,'pop')};
    if(deferStrip&&changed.indexOf(c)>=0)deferStrip(upd);else upd();
    rail.querySelector('[data-cat='+c+'] .tip').textContent=CAT_NAME[c]+' · '+p.name;
  });
  const sc=scores();
  fitEls.forEach((el,i)=>{el.classList.toggle('ok',sc[i]>=80);countTo(el.querySelector('.pc'),sc[i],v=>Math.round(v)+'%')});
  grid.querySelectorAll('.card').forEach(c=>c.classList.toggle('worn',look[c.dataset.k[0]]===c.dataset.k));
  undoBtn.disabled=!hist.length;
  renderRecs();
}

/* ---------- actions ---------- */
function wear(key,fromEl,quiet){
  const c=key[0];
  if(look[c]===key)return;
  hist.push(Object.assign({},look));
  look[c]=key;
  render([c]);
  let run=null;
  sync([c],fromEl?(fn=>{run=fn}):null);
  if(fromEl)fly(key,fromEl,slot(c),()=>run&&run());
  if(!quiet)toast('Trying on · '+P[key].name);
}
function cycle(c){const n=+look[c][1];wear(c+(n%3+1),null)}
function undo(){
  if(!hist.length)return;
  clearStylist();
  const prev=hist.pop(),changed=CATS.filter(c=>prev[c]!==look[c]);
  look=prev;render(changed);sync(changed);
}
const LOOKS=[
  ['Monochrome minimal',['t2','k1','s1','g1']],
  ['Wine romance',['t3','k3','s3','g3']],
  ['Weekend denim',['t1','k2','s2','g2']],
  ['Soft contrast',['t2','k3','s3','g2']],
  ['Campus cool',['t3','k2','s2','g3']]
];
let lookIdx=0,styT=[];
function clearStylist(){styT.forEach(clearTimeout);styT=[]}
function stylist(){
  clearStylist();
  const L=LOOKS[lookIdx++%LOOKS.length];
  toast('AI stylist · '+L[0]);
  L[1].filter(k=>look[k[0]]!==k).forEach((k,i)=>{styT.push(setTimeout(()=>wear(k,null,true),i*520))});
}

/* ---------- shop the look ---------- */
const buy=$('#buy'),buyLbl=$('#buyLbl'),badge=$('#badge');let buyT;
buy.addEventListener('click',()=>{
  replay(buy,'sweep');
  CATS.forEach((c,i)=>setTimeout(()=>fly(look[c],rowsEl.querySelector('[data-cat='+c+'] .pt'),buy),i*70));
  setTimeout(()=>badge.classList.add('on'),500);
  buyLbl.textContent='Added · view bag';
  clearTimeout(buyT);buyT=setTimeout(()=>{buyLbl.textContent='Shop the Look'},1800);
  toast('4 pieces added · '+money(total()));
});

/* ---------- init ---------- */
renderGrid();
sync();
moveBar();
const jobs=Object.keys(FILES).map(k=>load(H(FILES[k],1000),true).then(i=>{IMG[k]=i}))
  .concat(Object.keys(MASKS).map(k=>load(MASKS[k]).then(i=>{MSK[k]=i})));
Promise.all(jobs).then(()=>{ready=true;draw(ctxOld,look)}).catch(()=>toast('Could not load the model photos'));
})();
</script>
</body>
